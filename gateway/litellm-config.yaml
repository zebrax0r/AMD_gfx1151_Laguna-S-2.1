# LiteLLM gateway in front of llama-server. See README "Multi-user gateway".
# No secrets in this file — every credential comes from .secrets/gateway.env
# (gitignored), loaded by gateway.sh.
#
# Users only ever see the model name "local-coder". llama-server serves one
# model at a time and ignores the requested model name, so switching
# between Laguna and Flash-Next (serve-laguna.sh / ENV_FILE=flashnext.env)
# needs no change here or on any user's machine.

model_list:
  - model_name: local-coder
    litellm_params:
      model: openai/local-coder
      api_base: http://127.0.0.1:8000/v1
      api_key: os.environ/UPSTREAM_API_KEY
      # Long prefills are normal here: a 247K-token prompt took ~50 min on
      # Laguna. Don't let the gateway give up before llama-server does.
      timeout: 3600
      stream_timeout: 3600
    model_info:
      # Per-user context = CTX_SIZE / PARALLEL on the llama-server side.
      max_input_tokens: 262144
      max_output_tokens: 10000
      # Zero cost: LiteLLM still records prompt/completion tokens per key.
      # Set a nominal price here later if you want budgets (max_budget on a
      # key) to mean "N tokens" — e.g. 0.000001 = $1 per million tokens.
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  request_timeout: 3600
  num_retries: 0          # a retried 250K-token prompt would double a 50-min wait
  drop_params: true       # ignore OpenAI params llama-server doesn't know

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keep per-request token logs (what `./gateway.sh usage` reads)...
  disable_spend_logs: false
  # ...but never users' prompts or responses. This is LiteLLM's current
  # default (checked 2026-10-06: messages/response columns stay "{}");
  # pinned here so an upgrade can't quietly start storing conversations.
  store_prompts_in_spend_logs: false
